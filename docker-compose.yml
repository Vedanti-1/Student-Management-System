version: '3.8'

services:
  # Load Balancer distributing requests across all 5 scalable containers
  loadbalancer:
    image: nginx:alpine
    container_name: student-loadbalancer
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-container-1
      - api-container-2
      - api-container-3
      - api-container-4
      - api-container-5
    restart: always

  # Primary Container (Node 1)
  api-container-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-primary
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always

  # Scalable Copy Container 1 (Node 2)
  api-container-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-replica-1
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always

  # Scalable Copy Container 2 (Node 3)
  api-container-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-replica-2
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always

  # Scalable Copy Container 3 (Node 4)
  api-container-4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-replica-3
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always

  # Scalable Copy Container 4 (Node 5)
  api-container-5:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-replica-4
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always
