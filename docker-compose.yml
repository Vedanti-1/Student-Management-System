version: '3.8'

services:
  # Load Balancer distributing requests between copy containers
  loadbalancer:
    image: nginx:alpine
    container_name: student-loadbalancer
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-container-1
      - api-container-2
    restart: always

  # Primary Container
  api-container-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-primary
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always

  # Replica Copy Container for Scalability
  api-container-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-api-replica
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=*
    restart: always
