events { worker_connections 1024; }

http {
    upstream student_cluster {
        server api-container-1:5000;
        server api-container-2:5000;
        server api-container-3:5000;
        server api-container-4:5000;
        server api-container-5:5000;
        server api-container-6:5000;
        server api-container-7:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://student_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
