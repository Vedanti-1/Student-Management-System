services:
  # Primary Web Service Container (Node 1 - US West)
  - type: web
    name: student-management-system
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Scalable Copy Container 1 (Node 2 - Europe)
  - type: web
    name: student-management-system-replica
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Scalable Copy Container 2 (Node 3 - US East)
  - type: web
    name: student-management-system-replica-2
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Scalable Copy Container 3 (Node 4 - Asia Pacific / Singapore)
  - type: web
    name: student-management-system-replica-3
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Scalable Copy Container 4 (Node 5 - Asia Pacific / Singapore)
  - type: web
    name: student-management-system-replica-4
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false
