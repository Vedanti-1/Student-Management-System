
services:
  # Primary Web Service (Node 1 - Oregon)
  - type: web
    name: student-management-system
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Replica 1 (Node 2 - Frankfurt)
  - type: web
    name: student-management-system-replica
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Replica 2 (Node 3 - Ohio)
  - type: web
    name: student-management-system-replica-2
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false

  # Replica 3 (Node 4 - Singapore)
  - type: web
    name: student-management-system-replica-3
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "5000"
      - key: FRONTEND_URL
        value: "*"
      - key: MONGODB_URI
        sync: false
