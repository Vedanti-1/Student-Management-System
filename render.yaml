envVarGroups:
  - name: student-management-shared-env
    envVars:
      - key: FRONTEND_URL
        value: "*"

services:
  # Primary Web Service Container (Node 1 - US West)
  - type: web
    name: student-management-system
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - fromGroup: student-management-shared-env
      - key: MONGODB_URI
        sync: false

  # Scalable Copy Container 1 (Node 2 - Europe)
  - type: web
    name: student-management-system-replica
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    envVars:
